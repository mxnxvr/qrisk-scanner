# Post-quantum ready: TLS 1.3 with hybrid ML-KEM key exchange (needs OpenSSL 3.5+).
server {
    listen 443 ssl;
    server_name pq.qrisk.lab localhost;

    ssl_certificate     certs/pq.crt;        # ECDSA P-384 (ML-DSA certs aren't supported by browsers yet)
    ssl_certificate_key certs/pq.key;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:SecP384r1MLKEM1024:MLKEM1024:X25519;

    location / { return 200 "QRisk lab: pq-tls\n"; }
}
