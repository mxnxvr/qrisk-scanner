# DELIBERATELY INSECURE lab server. Expected QRisk results: critical.
server {
    listen 443 ssl;
    server_name weak.qrisk.lab localhost;

    ssl_certificate     certs/weak.crt;      # RSA-1024, SHA-1 signature
    ssl_certificate_key certs/weak.key;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    # Static RSA (no forward secrecy) and 3DES. OpenSSL 3 needs SECLEVEL=0 for TLS 1.0 and RSA-1024.
    # (Alpine's OpenSSL 3.5 silently drops DES-CBC3-SHA, so only the config scan reports it.)
    ssl_ciphers 'ECDHE-RSA-AES128-SHA:AES128-SHA:AES256-SHA:DES-CBC3-SHA:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    location / { return 200 "QRisk lab: weak-tls\n"; }
}
