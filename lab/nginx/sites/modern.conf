# A well-configured classical server: good today, quantum-vulnerable.
server {
    listen 443 ssl;
    server_name modern.qrisk.lab localhost;

    ssl_certificate     certs/modern.crt;    # ECDSA P-256
    ssl_certificate_key certs/modern.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:prime256v1;        # classical key exchange only

    location / { return 200 "QRisk lab: modern-tls\n"; }
}
