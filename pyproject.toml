[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "qrisk-scanner"
dynamic = ["version"]
description = "Find the cryptography you use, flag what quantum computers will break, and export a CycloneDX CBOM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Manar AL-Hajri" }]
keywords = ["post-quantum", "pqc", "cryptography", "cbom", "cyclonedx", "tls", "ssh", "security", "ml-kem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=43",
  "rich>=13",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "cyclonedx-python-lib[json-validation]>=8",
  "pyyaml>=6",
  "python-bidi>=0.6",
]

[project.urls]
Homepage = "https://github.com/mxnxvr/qrisk-scanner"
Issues = "https://github.com/mxnxvr/qrisk-scanner/issues"

[project.scripts]
qrisk = "qrisk.cli:main"

[tool.hatch.version]
path = "src/qrisk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet access (deselect with -m 'not network')",
  "lab: scans the Docker lab in lab/ (skipped unless it is running)",
]
